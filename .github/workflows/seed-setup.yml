name: seed-setup

# One-shot seed for the audience-model test studio. Manually triggered from
# the Actions tab. Creates the 15 test users, gives them memberships, and
# backfills ~120 days of synthetic booking history. Idempotent — safe to
# re-run; existing rows are upserted or skipped.
#
# Defaults to dry-run so the first click doesn't accidentally write anything.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log plan only, write nothing)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Force-rebuild: wipe existing seed bookings/instances per persona, then backfill fresh"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run seed setup
        env:
          SUPABASE_URL: ${{ secrets.SEED_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SEED_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEED_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_PASSWORD: ${{ secrets.SEED_TEST_USER_PASSWORD }}
          TEST_STUDIO_SLUG: ${{ vars.SEED_TEST_STUDIO_SLUG || 'brie-demo' }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          bun run scripts/seed/setup.ts $ARGS

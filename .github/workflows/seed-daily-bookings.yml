name: seed-daily-bookings

# Daily test-booking cron for the audience-model test studio. Each persona has
# a configured booking probability — over a week or two this populates every
# lifecycle bucket, frequency tier, and tag value in the audience model.
# Runs against TEST_STUDIO_SLUG (defaults to "brie-demo"), never production.

on:
  schedule:
    # 08:00 UTC daily (09:00 Europe/Oslo standard, 10:00 during DST).
    # Lands before the studio's morning class window so test bookings show
    # up the same day they're scheduled.
    - cron: "0 8 * * *"
  # Manual trigger for one-off runs and debugging.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log decisions but don't book"
        required: false
        default: "false"

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run daily seed
        env:
          SUPABASE_URL: ${{ secrets.SEED_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SEED_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEED_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_PASSWORD: ${{ secrets.SEED_TEST_USER_PASSWORD }}
          TEST_STUDIO_SLUG: ${{ vars.SEED_TEST_STUDIO_SLUG || 'brie-demo' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            bun run scripts/seed/daily.ts --dry-run
          else
            bun run scripts/seed/daily.ts
          fi

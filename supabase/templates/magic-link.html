<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your verification code</title>
</head>
<body style="margin:0;padding:0;background:#e4ddd4;font-family:'Fraunces','Georgia',serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#e4ddd4;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#faf8f5;border-radius:14px;overflow:hidden;max-width:100%;box-shadow:0 8px 32px rgba(70,55,40,0.10);">

          <!-- Header -->
          <tr>
            <td style="padding:36px 40px 0;">
              <p style="margin:0;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;color:#8a7c66;font-family:sans-serif;">Cami</p>
              <h1 style="margin:12px 0 0;font-size:24px;font-weight:400;color:#1a1611;line-height:1.2;">Your verification code</h1>
              <p style="margin:12px 0 0;font-size:15px;color:#5a4f42;font-family:sans-serif;line-height:1.5;">
                Use this code to finish signing in. It expires in 1 hour.
              </p>
            </td>
          </tr>

          <!-- Code block -->
          <tr>
            <td style="padding:28px 40px 8px;">
              <div style="background:#efe8df;border-radius:10px;padding:24px;text-align:center;">
                <div style="font-family:'SF Mono','Menlo','Consolas',monospace;font-size:36px;font-weight:500;color:#1a1611;letter-spacing:0.32em;">
                  {{ .Token }}
                </div>
              </div>
            </td>
          </tr>

          <!-- Plain text version — iOS Mail detects this and offers
               one-tap autofill on inputs with autocomplete="one-time-code". -->
          <tr>
            <td style="padding:8px 40px 0;text-align:center;">
              <p style="margin:0;font-size:13px;color:#8a7c66;font-family:sans-serif;">
                Your verification code is: {{ .Token }}
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:32px 40px 36px;border-top:1px solid rgba(0,0,0,0.06);margin-top:8px;">
              <p style="margin:0;font-size:13px;color:#8a7c66;line-height:1.6;font-family:sans-serif;">
                If you didn't try to sign in, you can safely ignore this email. No one can access your account without the code above.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
